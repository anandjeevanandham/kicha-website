<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kicha | Aachi Global School</title>
    <meta name="description" content="Games and drawing for Kicha at Aachi Global School." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="brand-copy">
            <strong>Kicha</strong>
            <span class="school-name">Aachi Global School</span>
          </span>
        </div>
        <div class="nav-links">
          <a href="#tic-tac-toe">Tic-tac-toe</a>
          <a href="#soundboard">Animal sounds</a>
          <a href="#paint">Paint</a>
        </div>
      </nav>
    </header>

    <main>
      <section id="tic-tac-toe" class="container">
        <div class="section-head">
          <h1>Tic-tac-toe</h1>
        </div>

        <div class="game-panel">
          <p id="gameStatus" class="game-status" aria-live="polite">X's turn</p>
          <div class="game-board" role="group" aria-label="Tic-tac-toe board">
            <button class="game-cell" type="button" data-cell="0" aria-label="Row 1, column 1"></button>
            <button class="game-cell" type="button" data-cell="1" aria-label="Row 1, column 2"></button>
            <button class="game-cell" type="button" data-cell="2" aria-label="Row 1, column 3"></button>
            <button class="game-cell" type="button" data-cell="3" aria-label="Row 2, column 1"></button>
            <button class="game-cell" type="button" data-cell="4" aria-label="Row 2, column 2"></button>
            <button class="game-cell" type="button" data-cell="5" aria-label="Row 2, column 3"></button>
            <button class="game-cell" type="button" data-cell="6" aria-label="Row 3, column 1"></button>
            <button class="game-cell" type="button" data-cell="7" aria-label="Row 3, column 2"></button>
            <button class="game-cell" type="button" data-cell="8" aria-label="Row 3, column 3"></button>
          </div>
          <button id="newGame" class="clear-btn game-reset" type="button">New game</button>
        </div>
      </section>

      <section id="soundboard" class="container">
        <div class="section-head">
          <h2>Animal soundboard</h2>
        </div>

        <div class="soundboard" role="group" aria-label="Animal sounds">
          <button class="animal-card animal-lion" type="button" data-animal="lion" aria-label="Play lion roar">
            <svg class="animal-illustration" viewBox="0 0 160 160" aria-hidden="true">
              <circle cx="80" cy="80" r="73" fill="#f4a944" />
              <circle cx="80" cy="80" r="57" fill="#ffd879" />
              <path d="M45 68c0-22 16-37 35-37s35 15 35 37v25c0 24-16 39-35 39S45 117 45 93z" fill="#ffe8a5" />
              <path d="M54 74a6 8 0 1 0 0 .1M106 74a6 8 0 1 0 0 .1" fill="#39283a" />
              <ellipse cx="80" cy="94" rx="17" ry="12" fill="#fff4d2" />
              <path d="M74 89q6-6 12 0-6 8-12 0" fill="#714350" />
              <path d="M80 97v7m0 0q-8 8-14 0m14 0q8 8 14 0" fill="none" stroke="#714350" stroke-linecap="round" stroke-width="3" />
              <circle cx="46" cy="92" r="4" fill="#f29b94" />
              <circle cx="114" cy="92" r="4" fill="#f29b94" />
            </svg>
            <span class="animal-name">Lion</span>
            <span class="animal-prompt">Tap to hear a roar!</span>
          </button>

          <button class="animal-card animal-dog" type="button" data-animal="dog" aria-label="Play dog bark">
            <svg class="animal-illustration" viewBox="0 0 160 160" aria-hidden="true">
              <path d="M47 43Q22 22 29 74q2 21 25 16m59-47q25-21 18 31-2 21-25 16" fill="#b76c45" />
              <path d="M43 63q0-31 37-31t37 31v31q0 35-37 35T43 94z" fill="#f3c28e" />
              <ellipse cx="64" cy="73" rx="5" ry="7" fill="#39283a" />
              <ellipse cx="96" cy="73" rx="5" ry="7" fill="#39283a" />
              <ellipse cx="80" cy="94" rx="20" ry="15" fill="#fff0d8" />
              <path d="M70 88q10-8 20 0-2 11-10 11t-10-11" fill="#39283a" />
              <path d="M80 99v7q-8 8-13-1m13 1q8 8 13-1" fill="none" stroke="#a44f59" stroke-linecap="round" stroke-width="3" />
              <path d="M48 89q-10 2-12 0m12 7q-10 5-13 4m77-11q10 2 12 0m-12 7q10 5 13 4" fill="none" stroke="#b77c58" stroke-linecap="round" stroke-width="2" />
            </svg>
            <span class="animal-name">Dog</span>
            <span class="animal-prompt">Tap to hear a bark!</span>
          </button>

          <button class="animal-card animal-cat" type="button" data-animal="cat" aria-label="Play cat meow">
            <svg class="animal-illustration" viewBox="0 0 160 160" aria-hidden="true">
              <path d="M37 69 42 28l31 24q7-2 14 0l31-24 5 41v26q0 39-43 39T37 95z" fill="#c8b6ed" />
              <path d="m49 43 20 15-22 18zm62 0L91 58l22 18z" fill="#f3a9b9" />
              <path d="M43 78q10-10 21 0m32 0q11-10 21 0" fill="none" stroke="#39283a" stroke-linecap="round" stroke-width="4" />
              <path d="m72 91 8-5 8 5-8 7z" fill="#dc829b" />
              <path d="M80 98v7q-7 7-12 0m12 0q7 7 12 0" fill="none" stroke="#714350" stroke-linecap="round" stroke-width="3" />
              <path d="M57 94 36 91m22 9-22 2m67-8 21-3m-21 9 22 2" fill="none" stroke="#8775ae" stroke-linecap="round" stroke-width="2" />
            </svg>
            <span class="animal-name">Cat</span>
            <span class="animal-prompt">Tap to hear a meow!</span>
          </button>
        </div>
        <p id="soundStatus" class="sound-status" aria-live="polite"></p>
      </section>

      <section id="paint" class="container">
        <div class="section-head">
          <h2>Draw with a pencil</h2>
        </div>

        <div class="paint-panel">
          <div class="paint-toolbar">
            <div class="color-picker" aria-label="Color palette">
              <button class="color-swatch active" data-color="#ff7aa2" style="background:#ff7aa2" aria-label="Pink"></button>
              <button class="color-swatch" data-color="#4ec7a5" style="background:#4ec7a5" aria-label="Green"></button>
              <button class="color-swatch" data-color="#8a6cf6" style="background:#8a6cf6" aria-label="Purple"></button>
              <button class="color-swatch" data-color="#f7d86a" style="background:#f7d86a" aria-label="Yellow"></button>
              <button class="color-swatch" data-color="#1c2439" style="background:#1c2439" aria-label="Black"></button>
            </div>

            <div class="size-box">
              <label for="brushSize">Brush</label>
              <input id="brushSize" type="range" min="2" max="18" value="4" />
              <span id="sizeValue">4px</span>
            </div>

            <button id="clearCanvas" class="clear-btn" type="button">Clear</button>
          </div>

          <div class="canvas-shell">
            <canvas id="drawingCanvas" aria-label="Drawing canvas"></canvas>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="game.js"></script>
    <script src="animal-sounds.js"></script>
  </body>
</html>
